<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="INVENTORY APP">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="INVENTORY APP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>INVENTORY APP</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('SW Unregistered');
        }
      });
    }

    if (window.caches) {
      caches.keys().then(function (names) {
        for (let name of names) {
          caches.delete(name);
          console.log('Cache Storage Cleared:', name);
        }
      });
    }

    window.addEventListener('load', function (ev) {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine({
            webRenderer: "html",
            useColorChromium: true
          }).then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <script>
    const script = document.createElement('script');
    script.src = "flutter_bootstrap.js?v=20260603.0037?v=" + Math.floor(Math.random() * 1000000);
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>

</html>
