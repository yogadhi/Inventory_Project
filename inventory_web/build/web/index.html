<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FSCounterMaster - Inventory Management System">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inventory_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>FSCounterMaster</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // 1. Matikan dan Hapus Service Worker yang sudah terlanjur terpasang
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('SW Unregistered untuk mencegah nyantol');
        }
      });
    }

    // 2. Bersihkan Cache Storage browser agar file lama dibuang
    if (window.caches) {
      caches.keys().then(function (names) {
        for (let name of names) {
          caches.delete(name);
          console.log('Cache Storage Cleared:', name);
        }
      });
    }

    // 3. Konfigurasi Flutter Loader
    window.addEventListener('load', function (ev) {
      // Download flutter_bootstrap.js?v=20260509.1451 secara manual untuk kontrol penuh
      _flutter.loader.load({
        serviceWorkerSettings: {
          // Paksa null agar Flutter tidak mencoba mencari flutter_service_worker.js
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <script src="flutter_bootstrap.js?v=20260509.1451" async></script>
</body>

</html>
